[project]
name = "oslm"
version = "0.1.0"
description = "Local RAG + QLoRA tutor for Process Synchronization"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic>=2.8",
    "httpx>=0.27",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "python-pptx>=1.0",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "torch>=2.6",
    "transformers>=4.51",
    "peft>=0.13",
    "trl>=0.19",
    "bitsandbytes>=0.45",
    "accelerate>=1.0",
    "datasets>=3.0",
    "google-genai>=1.0",
    "matplotlib>=3.9",
    "sentencepiece>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
oslm = "oslm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oslm"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Long natural-language prompt strings and inline test fixtures read better unwrapped.
"oslm/sft/generate.py" = ["E501"]
"oslm/sft/review.py" = ["E501"]
"oslm/sft/verify.py" = ["E501"]
"oslm/eval/*" = ["E501"]
"oslm/rag/prompts.py" = ["E501"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs live Ollama / WSL / models",
]
addopts = "-m 'not integration' --basetemp=.pytest_tmp -p no:cacheprovider"
